services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: documind-db
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: